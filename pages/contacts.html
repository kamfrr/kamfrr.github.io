<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакты | Южный Ветер</title>
  <meta name="description" content="Контактная информация компании Южный Ветер. Телефон, email, адрес. Закажите расчет оборудования.">
  <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
  <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">
  <link rel="canonical" href="/pages/contacts.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <script src="/js/components.js" defer></script>
  <script src="/js/form-handler.js" defer></script>
</head>
<body>
  <div id="site-header"></div>
  <main>
    <div class="breadcrumbs"><div class="container"><a href="/">Главная</a> <span>/</span> <span>Контакты</span></div></div>
    <section class="section">
      <div class="container">
        <h1>Контакты</h1>
        <div class="grid grid-sm-2" style="margin-top: var(--space-10);">
          <div>
            <h3 style="margin-bottom: var(--space-4);">Телефон</h3>
            <p style="font-size: var(--font-size-xl); font-weight: var(--font-weight-semibold); margin-bottom: var(--space-6);">+7 (XXX) XXX-XX-XX</p>
            <h3 style="margin-bottom: var(--space-4);">Email</h3>
            <p style="margin-bottom: var(--space-6);">info@example.com</p>
            <h3 style="margin-bottom: var(--space-4);">Адрес</h3>
            <p style="margin-bottom: var(--space-6);">г. Москва, ул. Примерная, д. 1</p>
            <h3 style="margin-bottom: var(--space-4);">Режим работы</h3>
            <p>Пн–Пт: 9:00 – 18:00</p>
          </div>
          <div style="padding: var(--space-8); background: var(--color-bg-alt); border-radius: var(--radius-xl);">
            <h2 style="margin-bottom: var(--space-4);">Форма обратной связи</h2>
            <form data-form action="/api/send-form.php" method="POST">
              <input type="text" name="website" style="position:absolute;left:-9999px;" tabindex="-1" autocomplete="off">
              <input type="hidden" name="page" value="Страница контактов">
              <div class="form-group"><input type="text" name="name" class="form-input" placeholder="Ваше имя" required></div>
              <div class="form-group"><input type="tel" name="phone" class="form-input" placeholder="Телефон" required></div>
              <div class="form-group"><input type="email" name="email" class="form-input" placeholder="Email"></div>
              <div class="form-group"><textarea name="message" class="form-textarea" placeholder="Сообщение"></textarea></div>
              <button type="submit" class="btn btn-primary" style="width: 100%;">Отправить</button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
</body>
</html>
